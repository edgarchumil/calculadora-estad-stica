<!doctype html>
<html lang="es">
  <!-- Configuración de la página: codificación, adaptación móvil, estilos y JavaScript. -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Tu laboratorio de estadística: analiza, visualiza y comprende tus datos."
    />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- El módulo se ejecuta después de analizar el HTML y puede importar stats.js. -->
    <script type="module" src="/app.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <!-- Escudo de la universidad y presentación del estudiante y su proyecto. -->
      <section
        class="university-panel"
        aria-label="Universidad Mariano Gálvez de Guatemala"
      >
        <img
          class="university-logo"
          src="/assets/umg-logo.webp"
          alt="Escudo de la Universidad Mariano Gálvez de Guatemala"
          width="3840"
          height="3842"
        />
        <div class="student-info">
          <p>
            <strong>Estudiante:</strong>
            Edy Armando Bocel Ibaté
          </p>
          <p>
            <strong>Carné:</strong>
            2290-25-23299
          </p>
          <p>
            <strong>Proyecto:</strong>
            Calculadora de Estadística
          </p>
        </div>
      </section>
      <!-- Acceso inspirado en la referencia: campos con iconos y registro debajo. -->
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-box">
          <h1 id="auth-title">Iniciar sesión</h1>
          <!-- La validación del navegador acompaña las comprobaciones de la API. -->
          <form id="auth-form">
            <div id="name-field" hidden>
              <label class="visually-hidden" for="name">Nombre</label>
              <div class="auth-field">
                <span class="auth-field-icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                  </svg>
                </span>
                <input
                  id="name"
                  name="name"
                  autocomplete="name"
                  minlength="2"
                  maxlength="60"
                  placeholder="Tu nombre"
                />
              </div>
            </div>
            <label class="visually-hidden" for="email">
              Correo electrónico
            </label>
            <div class="auth-field">
              <span class="auth-field-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="19"
                  height="19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 6 9 7 9-7"></path>
                </svg>
              </span>
              <input
                id="email"
                name="email"
                type="email"
                required
                maxlength="254"
                autocomplete="email"
                placeholder="Correo electrónico"
              />
            </div>
            <label class="visually-hidden" for="password">Contraseña</label>
            <div class="auth-field password-wrap">
              <span class="auth-field-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="19"
                  height="19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                  <path d="M12 14v3"></path>
                </svg>
              </span>
              <input
                id="password"
                name="password"
                type="password"
                required
                minlength="12"
                maxlength="128"
                autocomplete="current-password"
                placeholder="Contraseña"
                aria-describedby="password-help"
              />
              <button
                id="show-password"
                type="button"
                aria-label="Mostrar contraseña"
              >
                Ver
              </button>
            </div>
            <p id="password-help" class="auth-help">
              Contraseña de 12 a 128 caracteres.
            </p>
            <p id="auth-error" class="error" role="alert"></p>
            <button class="primary wide" id="auth-submit" type="submit">
              Iniciar sesión
            </button>
          </form>
          <!-- Ambos botones conservan el flujo de registro y login existente. -->
          <button id="register-tab" class="auth-switch" type="button">
            Crear una cuenta
          </button>
          <button id="login-tab" class="auth-switch" type="button" hidden>
            Ya tengo una cuenta
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
