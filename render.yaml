# Plan Free: SQLite es temporal y se pierde al suspender, reiniciar o desplegar.
services:
  - type: web
    name: estadia
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/estadia.sqlite
